services:
  mariadb:
    image: mariadb:11.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-file-per-table=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-123}
      MARIADB_AUTO_UPGRADE: 1
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-cache:
    image: redis:alpine
    command: ["redis-server", "--appendonly", "no"]
    restart: unless-stopped

  redis-queue:
    image: redis:alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-queue-data:/data
    restart: unless-stopped

  frappe:
    image: frappe/bench:latest
    command: sleep infinity
    environment:
      - SHELL=/bin/bash
      - FRAPPE_BIND_ADDR=0.0.0.0
      - WEB_PORT=${WEB_PORT:-8000}
      - SOCKETIO_PORT=${SOCKETIO_PORT:-9000}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-8080}
      # F-006: mailbox secrets resolved by enterprise_hub's Email Account provisioner.
      - EH_MAIL_NOTIFICATIONS_PASSWORD=${EH_MAIL_NOTIFICATIONS_PASSWORD:-}
      - EH_MAIL_SUPPORT_PASSWORD=${EH_MAIL_SUPPORT_PASSWORD:-}
      # F-006: CA bundle used by Python's ssl default context (Frappe IMAP/SMTP). In dev it is
      # system roots + the dev mail CA; unset -> system bundle, so public HTTPS is unaffected.
      - SSL_CERT_FILE=${MAIL_CLIENT_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
      - "127.0.0.1:${SOCKETIO_PORT:-9000}:9000"
      - "127.0.0.1:${WATCHER_PORT:-6787}:6787"
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./frappe-bench:/workspace/frappe-bench:cached
      - ./dashboard:/workspace/dashboard:cached
      # Bootstrap/ops scripts (scripts/setup-bench.sh rebuilds git-ignored bench state).
      - ./scripts:/workspace/scripts:ro
      - ./apps.json:/workspace/apps.json:ro
      - ./seed-data:/workspace/seed-data:cached
      - ./.env:/workspace/.env:ro
      - mail-trust:/etc/eh-mail-trust:ro
    working_dir: /workspace/frappe-bench
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # F-006 Self-Hosted Email (context/features/F-006-self-hosted-email/spec.md)
  # ---------------------------------------------------------------------------
  mail:
    image: stalwartlabs/stalwart:v0.16
    environment:
      # Admin credential used by mail-init and the web admin (http://localhost:${MAIL_ADMIN_PORT}).
      STALWART_RECOVERY_ADMIN: admin:${MAIL_ADMIN_PASSWORD:-}
      # Smarthost password, referenced by name from the relay route (MAIL_OUTBOUND_ROUTE=relay).
      MAIL_RELAY_PASSWORD: ${MAIL_RELAY_PASSWORD:-}
    ports:
      - "127.0.0.1:${MAIL_SUBMISSION_PORT:-465}:465"
      - "127.0.0.1:${MAIL_IMAPS_PORT:-993}:993"
      - "127.0.0.1:${MAIL_ADMIN_PORT:-8090}:8080"
    volumes:
      - stalwart-data:/var/lib/stalwart
      # Pre-seeded datastore config: skips the bootstrap wizard (normal mode on first start).
      - ./mail/stalwart/config.json:/etc/stalwart/config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'X-Forwarded-For: 127.0.0.1' http://127.0.0.1:8080/healthz/ready || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    restart: unless-stopped

  mail-init:
    build: ./mail/init
    image: enterprise-hub/mail-init:local
    environment:
      STALWART_URL: http://mail:8080
      STALWART_USER: admin
      STALWART_PASSWORD: ${MAIL_ADMIN_PASSWORD:-}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-hub.localhost}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.hub.localhost}
      MAIL_OUTBOUND_ROUTE: ${MAIL_OUTBOUND_ROUTE:-mailpit}
      MAIL_ACCOUNTS: ${MAIL_ACCOUNTS:-notifications:EH_MAIL_NOTIFICATIONS_PASSWORD,support:EH_MAIL_SUPPORT_PASSWORD}
      EH_MAIL_NOTIFICATIONS_PASSWORD: ${EH_MAIL_NOTIFICATIONS_PASSWORD:-}
      EH_MAIL_SUPPORT_PASSWORD: ${EH_MAIL_SUPPORT_PASSWORD:-}
      MAIL_RELAY_HOST: ${MAIL_RELAY_HOST:-}
      MAIL_RELAY_PORT: ${MAIL_RELAY_PORT:-587}
      MAIL_RELAY_USER: ${MAIL_RELAY_USER:-}
      MAIL_RELAY_IMPLICIT_TLS: ${MAIL_RELAY_IMPLICIT_TLS:-false}
      # dev-ca: issue + serve a local CA-signed cert; external: certs managed via ACME/manual.
      MAIL_TLS_MODE: ${MAIL_TLS_MODE:-external}
      MAIL_TLS_EXTRA_SANS: ${MAIL_TLS_EXTRA_SANS:-}
      # enabled (prod) | disabled (dev: mail without SPF/DKIM would land in Junk)
      MAIL_SPAM_FILTER: ${MAIL_SPAM_FILTER:-enabled}
    volumes:
      - mail-pki:/pki      # private: CA + leaf keys (mail-init only)
      - mail-trust:/trust  # public: CA bundle consumed by clients
    depends_on:
      mail:
        condition: service_healthy
    restart: "no"

  # Dev-only mail catcher: every non-local recipient is relayed here (MAIL_OUTBOUND_ROUTE=mailpit).
  mailpit:
    image: axllent/mailpit:v1.32.0
    profiles: ["dev"]
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  mariadb-data:
  redis-queue-data:
  stalwart-data:
  mail-pki:
  mail-trust:
